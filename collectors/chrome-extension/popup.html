<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #1a1a2e; }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    h1 span { color: #6366f1; }
    .section { margin-bottom: 12px; }
    .label { font-size: 11px; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .value { font-size: 13px; font-weight: 500; }
    .status { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; background: #f3f4f6; margin-bottom: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: #22c55e; }
    .dot.yellow { background: #eab308; }
    .dot.gray { background: #9ca3af; }
    input[type="text"] { width: 100%; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; outline: none; }
    input[type="text"]:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .tracking { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result { margin-top: 8px; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: none; }
    .result.success { background: #dcfce7; color: #166534; display: block; }
    .result.error { background: #fef2f2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <h1><span>&#9889;</span> EvoWork Tracker</h1>

  <div class="section">
    <div class="label">Server</div>
    <input type="text" id="serverUrl" placeholder="http://localhost:8000">
  </div>

  <div class="status" id="statusBox">
    <div class="dot gray" id="statusDot"></div>
    <span id="statusText">Checking...</span>
  </div>

  <div class="section">
    <div class="label">Buffered Events</div>
    <div class="value" id="bufferCount">0</div>
  </div>

  <div class="section" id="trackingSection" style="display:none">
    <div class="label">Currently Tracking</div>
    <div class="tracking" id="trackingUrl"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="sendBtn">Send Now</button>
    <button class="btn btn-secondary" id="clearBtn">Clear</button>
  </div>

  <div class="result" id="resultBox"></div>

  <script src="popup.js"></script>
</body>
</html>
